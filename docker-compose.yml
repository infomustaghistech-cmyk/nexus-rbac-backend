services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/nexus?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-only-secret-change-me-0123456789}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-local-dev-only-mfa-key-32-chars-long-01234}
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
    # Indexes are synced before the server starts because autoIndex is off in production.
    command: sh -c "node scripts/sync-indexes.js && node src/server.js"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/nexus?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-only-secret-change-me-0123456789}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-local-dev-only-mfa-key-32-chars-long-01234}
      LOG_LEVEL: info
    command: node src/worker.js

volumes:
  mongo-data:
  redis-data:
